[project]
name = "ume-data-supplier"
version = "0.1.0"
description = "Independent authenticated live-data supplier for UME"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=14,<16",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "eth-account>=0.13,<1",
  "eth-utils>=5,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
